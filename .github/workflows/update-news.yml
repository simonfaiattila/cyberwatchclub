name: Update robotaxi news feed

on:
  schedule:
    # Runs every 6 hours (UTC). Adjust the cron expression if you want a
    # different cadence — e.g. "0 * * * *" would be hourly.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run the watcher script
        run: python cybercab_watcher.py

      - name: Commit updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json seen_links.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-update news feed"
          git push
